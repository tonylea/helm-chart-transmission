suite: Deployment
release:
  name: transmission
templates:
  - templates/deployment.yaml
values:
  - ../ci/kind-values.yaml
tests:
  - it: runs one replica, stopping the old pod first
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: pins Transmission to the chart's appVersion and Gluetun to its own tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: lscr.io/linuxserver/transmission:4.1.4-r0-ls370
      - equal:
          path: spec.template.spec.containers[1].image
          value: lscr.io/linuxserver/transmission:4.1.4-r0-ls370
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: ghcr.io/qdm12/gluetun:v3.41.3

  - it: uses the image tags when they are set
    set:
      image.tag: 4.1.3-r0-ls1
      gluetun.image.tag: v3.41.2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: lscr.io/linuxserver/transmission:4.1.3-r0-ls1
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: lscr.io/linuxserver/transmission:4.1.3-r0-ls1
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: ghcr.io/qdm12/gluetun:v3.41.2

  - it: leaves the chart's version off the pod, so a chart-only release doesn't restart it
    chart:
      version: 9.9.9
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/name: transmission
            app.kubernetes.io/instance: transmission
            app.kubernetes.io/version: 4.1.4-r0-ls370

  - it: runs Gluetun first, as a native sidecar with root and NET_ADMIN
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: gluetun
      - equal:
          path: spec.template.spec.initContainers[0].restartPolicy
          value: Always
      - equal:
          path: spec.template.spec.initContainers[0].securityContext
          value:
            runAsUser: 0
            capabilities:
              add: [NET_ADMIN]

  - it: clears stale IP rules when Gluetun starts
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].lifecycle.postStart.exec.command[2]
          value: (ip rule del table 51820; ip -6 rule del table 51820) || true

  - it: passes the provider settings, the key from its Secret and the firewall settings to Gluetun
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: VPN_SERVICE_PROVIDER
            value: custom
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: WIREGUARD_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: gluetun
                key: wireguard-private-key
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: FIREWALL_INPUT_PORTS
            value: "9091"
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: FIREWALL_OUTBOUND_SUBNETS
            value: 10.0.0.0/8

  - it: sets the managed Transmission settings before it starts
    set:
      downloadQueueSize: 3
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: settings
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: DOWNLOAD_DIR
            value: /media/downloads
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: INCOMPLETE_DIR
            value: /incomplete
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: QUEUE_SIZE
            value: "3"
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: incomplete-dir-enabled
      - equal:
          path: spec.template.spec.initContainers[1].volumeMounts
          value:
            - name: config
              mountPath: /config

  - it: takes the RPC login from a Secret, for Transmission and the port-sync sidecar
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USER
            valueFrom:
              secretKeyRef:
                name: transmission
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PASS
            valueFrom:
              secretKeyRef:
                name: transmission
                key: password
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: PASS
            valueFrom:
              secretKeyRef:
                name: transmission
                key: password

  - it: runs Transmission and the port-sync sidecar in LinuxServer's non-root mode
    set:
      puid: 1026
      pgid: 100
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsUser: 1026
            runAsGroup: 100
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      - equal:
          path: spec.template.spec.containers[1].securityContext
          value:
            runAsUser: 1026
            runAsGroup: 100
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.runAsUser
          value: 1026

  - it: probes Transmission's port, because an HTTP probe gets 401 or 409
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: http

  - it: shares the forwarded port file with the port-sync sidecar, read-only
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts
          value:
            - name: gluetun
              mountPath: /tmp/gluetun
      - equal:
          path: spec.template.spec.containers[1].volumeMounts
          value:
            - name: gluetun
              mountPath: /tmp/gluetun
              readOnly: true
      - matchRegex:
          path: spec.template.spec.containers[1].command[2]
          pattern: transmission-remote localhost:9091

  - it: mounts the claims, each media claim at its own path, and an emptyDir on /run
    set:
      persistence.media:
        - name: tv
          existingClaim: tv-claim
          mountPath: /media/tv
        - name: films
          existingClaim: films-claim
          mountPath: /media/films
      downloadDir: /media/films/downloads
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: config
              mountPath: /config
            - name: incomplete
              mountPath: /incomplete
            - name: media-tv
              mountPath: /media/tv
            - name: media-films
              mountPath: /media/films
            - name: run
              mountPath: /run
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: config
              persistentVolumeClaim:
                claimName: config
            - name: incomplete
              persistentVolumeClaim:
                claimName: incomplete
            - name: media-tv
              persistentVolumeClaim:
                claimName: tv-claim
            - name: media-films
              persistentVolumeClaim:
                claimName: films-claim
            - name: gluetun
              emptyDir: {}
            - name: run
              emptyDir: {}

  - it: sets resources, but no limits unless asked
    set:
      resources:
        requests:
          cpu: 100m
      gluetun.resources:
        requests:
          memory: 64Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 100m
      - equal:
          path: spec.template.spec.initContainers[0].resources
          value:
            requests:
              memory: 64Mi
      - equal:
          path: spec.template.spec.containers[1].resources
          value: {}

  - it: has no service links or API token
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: fails without a VPN provider
    set:
      gluetun.env: {}
    asserts:
      - failedTemplate:
          errorMessage: "gluetun.env is required: it holds the VPN provider's settings"

  - it: fails without the firewall's outbound subnets
    set:
      gluetun.firewallOutboundSubnets: ""
    asserts:
      - failedTemplate:
          errorMessage: gluetun.firewallOutboundSubnets is required

  - it: fails without a media mount
    set:
      persistence.media: []
    asserts:
      - failedTemplate:
          errorMessage: persistence.media needs at least one mount

  - it: fails when a media mount has no mountPath
    set:
      persistence.media:
        - name: media
          existingClaim: media
    asserts:
      - failedTemplate:
          errorMessage: persistence.media mount media needs a mountPath

  - it: fails when downloadDir is outside every media mount
    set:
      downloadDir: /elsewhere
    asserts:
      - failedTemplate:
          errorMessage: downloadDir must be inside a persistence.media mountPath

  - it: fails without the Secret for the RPC login
    set:
      auth.password.secretKeyRef.name: ""
    asserts:
      - failedTemplate:
          errorMessage: auth.password.secretKeyRef.name is required

  - it: fails without the claim for /config
    set:
      persistence.config.existingClaim: ""
    asserts:
      - failedTemplate:
          errorMessage: persistence.config.existingClaim is required
